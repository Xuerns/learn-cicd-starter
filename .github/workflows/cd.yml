name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Build
        run: ./scripts/buildprod.sh

      - name: Auth
        uses: google-github-actions/auth@v2
        with: 
          credentials-json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set Up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-511502/notely-ar-repo/notely:latest .
